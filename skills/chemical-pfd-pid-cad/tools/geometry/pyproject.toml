[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-image-chemical-pfd-pid-geometry"
version = "0.1.0"
description = "Bounded drawing-geometry validation and explicit-port routing"
requires-python = ">=3.10"
dependencies = ["shapely>=2.1,<3", "ezdxf>=1.4.3,<2"]

[project.scripts]
pfd-geometry = "pfd_cli:main"

[tool.setuptools]
package-dir = {"" = "python"}
py-modules = ["pfd_cli", "pfd_guard", "pfd_router", "pfd_source_geometry", "pfd_primitives", "audit_lineweight_continuity"]
